    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="script/supabase.js"></script>
    <script>
        async function loadExplore() {
            if (!window.EtchSupabase) {
                console.warn('EtchSupabase not available');
                return;
            }

            try {
                const { data: listings, error } = await window.EtchSupabase.getListings({
                    status: 'published',
                    limit: 24
                });

                if (error) {
                    console.error('Error loading explore:', error);
                    const grid = document.getElementById('exploreGrid');
                    if (grid) {
                        grid.innerHTML = `
                            <div class="col-span-full text-center py-16">
                                <div class="w-20 h-20 mx-auto rounded-2xl bg-stone dark:bg-white/5 flex items-center justify-center text-4xl mb-4">🔍</div>
                                <h3 class="font-display text-xl font-bold text-ink dark:text-white">No assets available</h3>
                                <p class="text-slate dark:text-gray-400 mt-2">We couldn't load the explore page right now. Please try again later.</p>
                            </div>
                        `;
                    }
                    return;
                }

                const grid = document.getElementById('exploreGrid');
                if (!grid) return;

                const totalAssets = document.getElementById('totalAssets');
                const showingCount = document.getElementById('showingCount');
                const totalCount = document.getElementById('totalCount');

                const count = listings?.length || 0;
                if (totalAssets) totalAssets.textContent = count.toLocaleString();
                if (showingCount) showingCount.textContent = count.toLocaleString();
                if (totalCount) totalCount.textContent = count.toLocaleString();

                if (!listings || listings.length === 0) {
                    grid.innerHTML = `
                        <div class="col-span-full text-center py-16">
                            <div class="w-20 h-20 mx-auto rounded-2xl bg-stone dark:bg-white/5 flex items-center justify-center text-4xl mb-4">🔍</div>
                            <h3 class="font-display text-xl font-bold text-ink dark:text-white">No assets yet</h3>
                            <p class="text-slate dark:text-gray-400 mt-2">Check back soon for new creative works.</p>
                        </div>
                    `;
                    return;
                }

                grid.innerHTML = '';

                listings.forEach((listing, index) => {
                    const delay = index * 75;
                    const creatorName = listing.creator?.username || listing.creator?.full_name || 'Unknown';
                    const creatorInitials = (creatorName || 'ET').slice(0, 2).toUpperCase();
                    const imageUrl = listing.cover_url || 'https://images.unsplash.com/photo-1497032628192-86f99bcd76bc?auto=format&fit=crop&w=400&q=80';
                    const price = listing.price ? '$' + Number(listing.price).toLocaleString() : '$0';
                    const category = listing.category ? listing.category.charAt(0).toUpperCase() + listing.category.slice(1) : 'Asset';
                    const views = listing.views || 0;
                    const slug = listing.slug || listing.id;

                    const card = document.createElement('div');
                    card.className = `group bg-white dark:bg-ink/50 rounded-2xl border border-border dark:border-white/10 overflow-hidden hover:border-olive/30 hover:shadow-2xl hover:-translate-y-2 transition-all duration-500`;
                    card.style.animationDelay = `${delay}ms`;

                    card.innerHTML = `
                        <a href="${EtchUI.listingUrl(listing)}" class="block">
                            <div class="relative overflow-hidden">
                                <img src="${EtchUI.escapeHtml(EtchUI.safeUrl(imageUrl))}" alt="${EtchUI.escapeHtml(listing.title || 'Creative work')}"
                                    class="w-full h-52 object-cover group-hover:scale-105 transition-transform duration-500" />
                                <div class="absolute top-3 left-3 flex gap-2">
                                    <span class="px-3 py-1 bg-white/90 dark:bg-ink/90 backdrop-blur-sm text-xs font-medium text-ink dark:text-white rounded-full">${EtchUI.escapeHtml(category)}</span>
                                </div>
                                <button class="absolute top-3 right-3 p-2 bg-white/90 dark:bg-ink/90 backdrop-blur-sm rounded-full opacity-0 group-hover:opacity-100 transition-all duration-300 hover:bg-olive hover:text-white">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                                    </svg>
                                </button>
                            </div>
                            <div class="p-5">
                                <div class="flex items-center justify-between mb-2">
                                    <h3 class="font-semibold text-ink dark:text-white group-hover:text-olive transition-colors duration-200 line-clamp-1">${EtchUI.escapeHtml(listing.title || 'Untitled')}</h3>
                                    <span class="text-lg font-bold text-ink dark:text-white">${EtchUI.escapeHtml(price)}</span>
                                </div>
                                <p class="text-sm text-slate dark:text-gray-400 line-clamp-2">${EtchUI.escapeHtml(listing.description || '')}</p>
                                <div class="flex items-center justify-between mt-4 pt-4 border-t border-border dark:border-white/10">
                                    <div class="flex items-center gap-2">
                                        <div class="w-6 h-6 rounded-full bg-olive/20 flex items-center justify-center text-[10px] font-bold text-olive">${EtchUI.escapeHtml(creatorInitials)}</div>
                                        <span class="text-xs text-slate dark:text-gray-400">@${EtchUI.escapeHtml(creatorName)}</span>
                                    </div>
                                    <div class="flex items-center gap-3 text-xs text-slate dark:text-gray-400">
                                        <span class="flex items-center gap-1">
                                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                            </svg>
                                            ${views.toLocaleString()}
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </a>
                    `;

                    grid.appendChild(card);
                });
            } catch (error) {
                console.error('Failed to load explore:', error);
                const grid = document.getElementById('exploreGrid');
                if (grid) {
                    grid.innerHTML = `
                        <div class="col-span-full text-center py-16">
                            <div class="w-20 h-20 mx-auto rounded-2xl bg-stone dark:bg-white/5 flex items-center justify-center text-4xl mb-4">🔍</div>
                            <h3 class="font-display text-xl font-bold text-ink dark:text-white">No assets available</h3>
                            <p class="text-slate dark:text-gray-400 mt-2">We couldn't load the explore page right now. Please try again later.</p>
                        </div>
                    `;
                }
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadExplore);
        } else {
            loadExplore();
        }
    </script>
