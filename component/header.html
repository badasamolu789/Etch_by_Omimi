<!-- ============================================ -->
<!-- SHARED HEADER - Include on all public pages -->
<!-- ============================================ -->
<header
    class="fixed top-0 left-0 right-0 z-50 bg-white/80 dark:bg-ink/80 backdrop-blur-xl border-b border-border/40 dark:border-white/10 transition-colors duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16 md:h-20">

            <!-- Logo -->
            <a href="/index.html" class="flex items-center gap-2 group">
                <img src="/assets/logo.png" alt="ETCH logo"
                    class="h-8 w-8 object-contain transition-transform duration-300 group-hover:scale-110" />
                <div>
                    <span class="font-display text-2xl font-bold text-ink dark:text-white">ETCH</span>
                    <span class="block -mt-1 text-[10px] font-medium text-olive tracking-widest uppercase">by
                        OMIMI</span>
                </div>
            </a>

            <!-- Desktop Navigation -->
            <nav class="hidden lg:flex items-center gap-8" aria-label="Main navigation">
                <a href="/explore.html"
                    class="text-sm font-medium text-slate dark:text-gray-400 hover:text-ink dark:hover:text-white transition-colors duration-200"
                    data-nav-link>Explore</a>
                <a href="/products.html"
                    class="text-sm font-medium text-slate dark:text-gray-400 hover:text-ink dark:hover:text-white transition-colors duration-200"
                    data-nav-link>Marketplace</a>
                <a href="/masterclass.html"
                    class="text-sm font-medium text-slate dark:text-gray-400 hover:text-ink dark:hover:text-white transition-colors duration-200"
                    data-nav-link>Masterclass</a>
                <a href="/about.html"
                    class="text-sm font-medium text-slate dark:text-gray-400 hover:text-ink dark:hover:text-white transition-colors duration-200"
                    data-nav-link>About</a>
                <a href="/contact.html"
                    class="text-sm font-medium text-slate dark:text-gray-400 hover:text-ink dark:hover:text-white transition-colors duration-200"
                    data-nav-link>Contact</a>
            </nav>

            <!-- Right Actions -->
            <div class="flex items-center gap-3">

                <!-- Search -->
                <div
                    class="hidden md:flex items-center gap-2 px-3 py-2 bg-stone dark:bg-white/5 rounded-xl border border-border/40 dark:border-white/10 focus-within:border-olive focus-within:ring-2 focus-within:ring-olive/20 transition-all duration-200 search-input">
                    <svg class="w-4 h-4 text-slate/40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                    <input type="text" placeholder="Search marketplace..."
                        class="bg-transparent border-none outline-none text-sm text-ink dark:text-white placeholder:text-slate/40 w-40 lg:w-56" />
                    <kbd
                        class="hidden lg:block text-[10px] font-medium text-slate/40 bg-white/50 dark:bg-ink/50 px-1.5 py-0.5 rounded">⌘K</kbd>
                </div>

                <!-- Theme Toggle -->
                <button id="themeToggle"
                    class="theme-toggle p-2 rounded-xl text-slate dark:text-gray-400 hover:bg-stone dark:hover:bg-white/10 transition-all duration-300"
                    aria-label="Toggle theme">
                    <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                    <svg class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                </button>

                <!-- Auth Buttons -->
                <a href="/user/auth/signin.html"
                    class="hidden sm:inline-block px-4 py-2 text-sm font-medium text-slate dark:text-gray-300 hover:text-ink dark:hover:text-white transition-colors duration-200">Sign
                    In</a>
                <a href="/user/auth/signup.html"
                    class="px-5 py-2 text-sm font-medium bg-olive text-white rounded-xl hover:bg-olive-dark hover:shadow-lg hover:shadow-olive/20 transition-all duration-300 hover:-translate-y-0.5">Get
                    Started</a>

                <!-- Mobile Menu Toggle -->
                <button id="mobileMenuToggle"
                    class="lg:hidden p-2 text-ink dark:text-white hover:text-olive transition-colors duration-200"
                    aria-label="Toggle menu">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Mobile Menu -->
    <div id="mobileMenu"
        class="mobile-menu lg:hidden hidden bg-white dark:bg-ink border-t border-border/40 dark:border-white/10 px-4 py-6 space-y-4 transition-all duration-300">
        <div
            class="search-input flex items-center gap-2 px-3 py-2 bg-stone dark:bg-white/5 rounded-xl border border-border/40 dark:border-white/10">
            <svg class="w-4 h-4 text-slate/40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
            <input type="text" placeholder="Search..."
                class="bg-transparent border-none outline-none text-sm text-ink dark:text-white placeholder:text-slate/40 w-full" />
        </div>
        <a href="/explore.html"
            class="mobile-menu-link block text-ink dark:text-white font-medium hover:text-olive transition-colors duration-200">Explore</a>
        <a href="/products.html"
            class="mobile-menu-link block text-ink dark:text-white font-medium hover:text-olive transition-colors duration-200">Marketplace</a>
        <a href="/masterclass.html"
            class="mobile-menu-link block text-ink dark:text-white font-medium hover:text-olive transition-colors duration-200">Masterclass</a>
        <a href="/about.html"
            class="mobile-menu-link block text-ink dark:text-white font-medium hover:text-olive transition-colors duration-200">About</a>
        <a href="/contact.html"
            class="mobile-menu-link block text-ink dark:text-white font-medium hover:text-olive transition-colors duration-200">Contact</a>
        <div class="pt-4 border-t border-border/40 dark:border-white/10 flex flex-col gap-3">
            <a href="/user/auth/signin.html"
                class="text-center px-4 py-3 text-sm font-medium text-slate dark:text-gray-300 hover:text-ink dark:hover:text-white transition-colors duration-200">Sign
                In</a>
            <a href="/user/auth/signup.html"
                class="text-center px-4 py-3 text-sm font-medium bg-olive text-white rounded-xl hover:bg-olive-dark transition-all duration-300">Get
                Started</a>
        </div>
    </div>
</header>
