<body><div class="admin-dashboard"><div data-component="include" data-src="component/sidebar.html"></div><main class="admin-dashboard-main"><div data-component="include" data-src="component/topbar.html"></div><section class="legal-admin-page">
<h1>Legal pages</h1><p class="legal-intro">Create your Terms of Service and Privacy Policy with Markdown or HTML. Preview the finished page before publishing. Each save keeps a separate version.</p>
<form id="legalEditor" class="legal-editor">

<article id="legalPreview" class="legal-preview legal-content" aria-label="Formatted document preview" hidden></article>
<div class="legal-editor-footer"><label class="legal-publish" for="legalPublish"><input id="legalPublish" type="checkbox">Publish this version now</label><div class="legal-editor-actions"><a href="/terms" target="_blank" rel="noopener">View Terms</a><a href="/privacy" target="_blank" rel="noopener">View Privacy</a><button id="legalSave" type="submit" class="admin-action admin-action-primary" disabled>Save draft</button></div></div>
