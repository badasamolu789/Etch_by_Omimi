<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ETCH email previews</title><body style="margin:0;background:#F2F3ED;color:#17251D;font-family:Arial,sans-serif"><main style="max-width:1000px;margin:auto;padding:32px 16px"><h1 style="font-family:Georgia,serif">ETCH email collection</h1><p>Sample data only. Buttons in these previews do not authenticate. Paste files from auth/ into Supabase, never files from previews/.</p><label for="template">Choose an email </label><select id="template" style="padding:12px;max-width:100%"><option value="confirm-signup">Confirm sign up</option><option value="invite-user">Invite user</option><option value="magic-link">Magic link</option><option value="change-email">Change email address</option><option value="reset-password">Reset password</option><option value="reauthentication">Reauthentication</option><option value="password-changed">Password changed</option><option value="email-changed">Email address changed</option><option value="phone-changed">Phone number changed</option><option value="identity-linked">Sign-in method linked</option><option value="identity-unlinked">Sign-in method removed</option><option value="mfa-added">Verification method added</option><option value="mfa-removed">Verification method removed</option><option value="founding-acceptance">Founding Voices acceptance</option></select><p id="subject"></p><iframe title="Email preview" id="preview" style="width:100%;height:950px;border:1px solid #DCE3CC;border-radius:12px;background:#F2F3ED" src="previews/confirm-signup.html"></iframe><script>const subjects={"confirm-signup":"Welcome to ETCH — confirm your email","invite-user":"You’re invited to ETCH","magic-link":"Your ETCH sign-in link","change-email":"Confirm your ETCH email change","reset-password":"Reset your ETCH password","reauthentication":"Your ETCH security code","password-changed":"Security alert: your ETCH password changed","email-changed":"Security alert: your ETCH email changed","phone-changed":"Security alert: your ETCH phone number changed","identity-linked":"Security alert: a sign-in method was linked to ETCH","identity-unlinked":"Security alert: a sign-in method was removed from ETCH","mfa-added":"Security alert: a verification method was added to ETCH","mfa-removed":"Security alert: a verification method was removed from ETCH"};const select=document.getElementById('template');function show(){document.getElementById('preview').src='previews/'+select.value+'.html';document.getElementById('subject').textContent='Subject: '+(subjects[select.value]||'Welcome to ETCH Founding Voices');}select.addEventListener('change',show);show();</script></main></body></html>
