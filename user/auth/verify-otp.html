                            <input type="text" maxlength="1" data-otp-input

                            <input type="text" maxlength="1" data-otp-input

                            <input type="text" maxlength="1" data-otp-input

    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Supabase Config -->
    <script>
        window.__ETCH_SUPABASE__ = {

            anonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN5b2RkdmVoenJtaHVibWlzbGJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNjI3MTQsImV4cCI6MjEwMDczODcxNH0.YaUyKP9f3tpKDny78_k_ka70zkFZe58GAFOo5oFFaFI',

    <!-- ETCH Supabase Helper -->

    <!-- ETCH Error Handler -->
    <script src="../../script/error-handler.js"></script>

    <script src="../../script/script.js"></script>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // Theme Toggle (separate for auth page)
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;

        if (localStorage.getItem('theme') === 'dark') {
            html.classList.add('dark');
            html.setAttribute('data-theme', 'dark');
        }

        themeToggle.addEventListener('click', () => {
            html.classList.toggle('dark');
            const isDark = html.classList.contains('dark');
            html.setAttribute('data-theme', isDark ? 'dark' : 'light');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });

        // ============================================
        // OTP INPUT HANDLING
        // ============================================
        const otpInputs = document.querySelectorAll('[data-otp-input]');
        const otpForm = document.querySelector('form[data-handle-submit]');
        const submitBtn = otpForm?.querySelector('button[type="submit"]');
        const errorEl = document.getElementById('otpError');
        const successEl = document.getElementById('otpSuccess');
        const emailDisplay = document.getElementById('emailDisplay');
        const resendBtn = document.getElementById('resendBtn');

        // Get email from URL params or localStorage
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email') || localStorage.getItem('etch_pending_email') || '';

        // Display email
        if (emailDisplay && email) {
            emailDisplay.textContent = email;
        }

        // Auto-focus first input
        if (otpInputs.length > 0) {
            otpInputs[0].focus();
        }

        // Handle input navigation
        otpInputs.forEach((input, index) => {
            // Handle input
            input.addEventListener('input', (e) => {
                const value = e.target.value.replace(/[^0-9]/g, '');
                e.target.value = value;

                // Move to next input
                if (value && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }

                // Auto-submit when all fields are filled
                if (index === otpInputs.length - 1 && value) {
                    const allFilled = Array.from(otpInputs).every(i => i.value.length === 1);
                    if (allFilled) {
                        otpForm.dispatchEvent(new Event('submit'));
                    }
                }
            });

            // Handle backspace
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });

            // Handle paste
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pasteData = e.clipboardData.getData('text').replace(/[^0-9]/g, '');
                if (pasteData.length === 6) {
                    otpInputs.forEach((input, i) => {
                        input.value = pasteData[i];
                    });
                    otpForm.dispatchEvent(new Event('submit'));
                }
            });
        });

        // ============================================
        // VERIFY OTP
        // ============================================
        otpForm?.addEventListener('submit', async function (e) {
            e.preventDefault();

            // Hide previous messages
            if (errorEl) errorEl.classList.add('hidden');
            if (successEl) successEl.classList.add('hidden');

            // Collect OTP
            const otp = Array.from(otpInputs).map(input => input.value).join('');

            if (otp.length !== 6) {
                if (errorEl) {
                    errorEl.textContent = 'Please enter the complete 6-digit code';
                    errorEl.classList.remove('hidden');
                }
                return;
            }

            // Show loading state
            if (submitBtn) {
                submitBtn.disabled = true;
                const originalText = submitBtn.querySelector('span');
                if (originalText) originalText.textContent = 'Verifying...';
            }

            try {
                // Verify OTP with Supabase
                const { data, error } = await EtchSupabase.getClient().auth.verifyOtp({
                    email: email,
                    token: otp,
                    type: 'email'
                });

                if (error) {
                    throw error;
                }

                // Success
                if (successEl) {
                    successEl.textContent = 'Email verified successfully! Redirecting...';
                    successEl.classList.remove('hidden');
                }

                // Clear stored email
                localStorage.removeItem('etch_pending_email');

                // Redirect to dashboard after 2 seconds
                setTimeout(() => {
                    window.location.href = '../dashboard.html';
                }, 2000);

            } catch (error) {
                // Use centralized error handler
                EtchErrorHandler.displayError(error, 'otpError');

                // Clear OTP inputs
                otpInputs.forEach(input => input.value = '');
                otpInputs[0].focus();

                if (submitBtn) {
                    submitBtn.disabled = false;
                    const originalText = submitBtn.querySelector('span');
                    if (originalText) originalText.textContent = 'Verify Email';
                }
            }
        });

        // ============================================
        // RESEND OTP
        // ============================================
        resendBtn?.addEventListener('click', async function () {
            if (!email) {
                if (errorEl) {
                    errorEl.textContent = 'Email address not found. Please sign up again.';
                    errorEl.classList.remove('hidden');
                }
                return;
            }

            // Disable button
            resendBtn.disabled = true;
            resendBtn.textContent = 'Sending...';

            try {
                // Resend OTP
                const { error } = await EtchSupabase.getClient().auth.signUp({
                    email: email,
                    password: 'temp_password', // Temporary password, user will set it later
                    options: {
                        data: {
                            full_name: '',
                            username: 'creator_' + Math.random().toString(36).substring(2, 8),
                        },
                    },
                });

                if (error) {
                    throw error;
                }

                // Show success message
                if (successEl) {
                    successEl.textContent = 'New verification code sent! Check your inbox.';
                    successEl.classList.remove('hidden');
                }

                // Re-enable button after 60 seconds
                setTimeout(() => {
                    resendBtn.disabled = false;
                    resendBtn.textContent = 'Resend';
                }, 60000);

            } catch (error) {
                if (errorEl) {
                    errorEl.textContent = 'Failed to resend code. Please try again.';
                    errorEl.classList.remove('hidden');
                }
                resendBtn.disabled = false;
                resendBtn.textContent = 'Resend';
            }
        });
    </script>
