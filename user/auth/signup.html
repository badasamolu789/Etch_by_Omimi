        <!-- Theme Toggle -->
        <button id="themeToggle"
            class="absolute top-6 right-6 md:top-8 md:right-8 p-2 rounded-xl text-slate/60 dark:text-gray-500 hover:bg-white/60 dark:hover:bg-white/5 transition-all duration-300 z-10"

                        <span class="block -mt-1 text-[10px] font-medium text-olive tracking-widest uppercase">by

                </div>
                <h2 class="font-display text-2xl font-bold text-ink dark:text-white">Join the studio ✦</h2>

                    </div>
                    <div class="relative flex justify-center text-xs">
                        <span class="px-3 bg-white/80 dark:bg-ink/80 text-slate/40">create with email</span>
                    </div>
                </div>

                <!-- Form -->
                <form class="space-y-4" data-auth-form>
                    <div>
                        <label class="block text-sm font-medium text-ink dark:text-white mb-1.5">Full Name</label>
                        <div class="relative">
                            <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate/40" fill="none"

                            </svg>

                                class="w-full pl-11 pr-4 py-3 bg-white/60 dark:bg-ink/60 border border-border/60 dark:border-white/10 rounded-2xl text-sm text-ink dark:text-white placeholder:text-slate/40 focus:outline-none focus:ring-2 focus:ring-olive/20 focus:border-olive transition-all duration-200" />
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-ink dark:text-white mb-1.5">Email Address</label>
                        <div class="relative">
                            <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate/40" fill="none"

                            <input type="email" name="email" placeholder="you@example.com" required
                                class="w-full pl-11 pr-4 py-3 bg-white/60 dark:bg-ink/60 border border-border/60 dark:border-white/10 rounded-2xl text-sm text-ink dark:text-white placeholder:text-slate/40 focus:outline-none focus:ring-2 focus:ring-olive/20 focus:border-olive transition-all duration-200" />
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-ink dark:text-white mb-1.5">Password</label>
                        <div class="relative">
                            <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate/40" fill="none"
                                stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                            <input type="password" name="password" minlength="8" autocomplete="new-password" placeholder="••••••••" required
                                class="w-full pl-11 pr-12 py-3 bg-white/60 dark:bg-ink/60 border border-border/60 dark:border-white/10 rounded-2xl text-sm text-ink dark:text-white placeholder:text-slate/40 focus:outline-none focus:ring-2 focus:ring-olive/20 focus:border-olive transition-all duration-200" />
                            <button type="button"
                                class="absolute right-4 top-1/2 -translate-y-1/2 text-slate/40 hover:text-ink dark:hover:text-white transition-colors duration-200"
                                id="togglePassword" aria-label="Show password" aria-pressed="false">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                            </button>
                        </div>
                        <div id="passwordRequirements" class="password-requirements"></div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-ink dark:text-white mb-1.5">Confirm
                            Password</label>
                        <div class="relative">
                            <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate/40" fill="none"
                                stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                            </svg>
                            <input type="password" name="confirm_password" autocomplete="new-password" placeholder="••••••••" required
                                class="w-full pl-11 pr-4 py-3 bg-white/60 dark:bg-ink/60 border border-border/60 dark:border-white/10 rounded-2xl text-sm text-ink dark:text-white placeholder:text-slate/40 focus:outline-none focus:ring-2 focus:ring-olive/20 focus:border-olive transition-all duration-200" />
                        </div>
                    </div>

                    <p id="passwordMatch" class="password-match" aria-live="polite" hidden></p>
                    <label class="block">Account type<select name="account_type" class="block w-full p-3 border rounded-xl"><option value="writer">Writer</option><option value="producer">Producer</option></select></label>
                    <!-- Terms -->
                    <div id="signupConsent" class="flex items-start gap-2 pt-1" hidden>
                        <input type="checkbox" aria-label="I agree to the published Terms of Service and Privacy Policy" disabled
                            class="w-4 h-4 mt-0.5 rounded border-border/60 dark:border-white/10 text-olive focus:ring-olive focus:ring-2" />
                        <span class="text-sm text-slate/60 dark:text-gray-500">

                                Service</a> and <a href="/privacy"
                                class="text-olive hover:text-olive-dark transition-colors duration-200">Privacy
                                Policy</a>
                        </span>
                    </div>

                    <button type="submit"
                        class="w-full flex items-center justify-center gap-2 px-6 py-3 bg-gradient-to-r from-olive to-mint text-white rounded-2xl font-medium hover:shadow-xl hover:shadow-olive/20 hover:-translate-y-0.5 transition-all duration-300 group">
                        <span>Create Studio</span>
                        <svg class="w-4 h-4 group-hover:translate-x-1 transition-transform duration-200" fill="none"
                            stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M13 7l5 5m0 0l-5 5m5-5H6" />
                        </svg>
                    </button>
                </form>

                <!-- Sign In Link -->
                <p class="text-center text-sm text-slate/60 dark:text-gray-500 mt-6">
                    Already have a studio?
                    <a href="signin.html"
                        class="text-olive font-medium hover:text-olive-dark transition-colors duration-200">Sign In
                        →</a>
                </p>
            </div>

            <!-- Footer Text -->

                    class="hover:text-olive transition-colors duration-200">Privacy Policy</a>
